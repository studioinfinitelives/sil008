# Monday 14:20 UTC the weekly update report (pin and dependencies; never commits or pushes), 15:20 UTC the
# read-only health check.
# Run by hand from the Actions tab: both jobs, update first. Schedules are staggered 10 minutes per project (one runner).
# INLINE COPY of sil_common/.github/workflows/update.yml and weekly.yml: a public repo cannot call a private
# repo's reusable workflow. Keep the steps in step with those files.
# Never add a pull_request trigger: this runs on a self-hosted machine (make doctor enforces it).
name: scheduled

on:
  schedule:
    - cron: "20 14 * * 1"
    - cron: "20 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 14 * * 1'
    runs-on: [self-hosted, home-mac]
    timeout-minutes: 60
    concurrency:
      group: scheduled-${{ github.repository }}-update
      cancel-in-progress: false
    env:
      NAME: ${{ github.event.repository.name }}
      HC_PING: ${{ secrets.HC_PING_WEEKLY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ github.event.repository.name }}
          ref: dev
          clean: true
          fetch-depth: 0
      - name: Fetch sil_common at its latest tag
        run: |
          tag="$(git ls-remote --tags --refs git@github.com:studioinfinitelives/sil_common.git 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)"
          [ -n "$tag" ] || { echo "no v* tag found on sil_common" >&2; exit 1; }
          rm -rf sil_common
          git clone --depth 1 --branch "$tag" git@github.com:studioinfinitelives/sil_common.git sil_common
      - name: Report the update
        # A hung flutter or npm has blocked the one runner before: fail instead.
        timeout-minutes: 45
        run: SUMMARY_FILE="$RUNNER_TEMP/update-summary.txt" bash sil_common/tool/ci/update.sh "$NAME" report
      - name: Ping on failure
        if: failure() || cancelled()
        run: |
          summary="$RUNNER_TEMP/update-summary.txt"
          [ -s "$summary" ] || echo "update failed or timed out before writing a summary; see the run log" > "$summary"
          bash sil_common/tool/ci/ping.sh fail "$summary"
      - name: Remove ciFiles
        if: always()
        run: bash sil_common/tool/ci/files.sh "$NAME" clean

  weekly:
    needs: update
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '20 15 * * 1') }}
    runs-on: [self-hosted, home-mac]
    timeout-minutes: 45
    concurrency:
      group: scheduled-${{ github.repository }}-weekly
      cancel-in-progress: false
    env:
      NAME: ${{ github.event.repository.name }}
      HC_PING: ${{ secrets.HC_PING_WEEKLY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ github.event.repository.name }}
          clean: true
          fetch-depth: 0
      - name: Fetch sil_common at the pinned tag
        run: |
          common="$(jq -r .common "$NAME/sil.json")"
          rm -rf sil_common
          git clone --depth 1 --branch "$common" git@github.com:studioinfinitelives/sil_common.git sil_common
      - name: Health check
        # A hung flutter or npm has blocked the one runner before: fail instead.
        timeout-minutes: 30
        run: SUMMARY_FILE="$RUNNER_TEMP/weekly-summary.txt" bash sil_common/tool/ci/weekly.sh "$NAME"
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          path: ${{ github.event.repository.name }}/.lighthouseci
          if-no-files-found: ignore
      - name: Ping
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          summary="$RUNNER_TEMP/weekly-summary.txt"
          if [ "$JOB_STATUS" = success ]; then
            bash sil_common/tool/ci/ping.sh ok "$summary"
          else
            [ -s "$summary" ] || echo "weekly check failed or timed out before writing a summary; see the run log" > "$summary"
            bash sil_common/tool/ci/ping.sh fail "$summary"
          fi
