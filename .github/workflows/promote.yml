# Ships a dev commit to prod: run by /prod sil008. Moves master only here. The logic is sil_common's tool/ci/.
# INLINE COPY of sil_common/.github/workflows/promote.yml: a public repo cannot call a private repo's
# reusable workflow. Keep the steps in step with that file.
# Never add a pull_request trigger (self-hosted runner; make doctor enforces it).
name: promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on dev to ship (default the dev head)
        required: false
        default: ""
        type: string

permissions:
  contents: write
  deployments: write
  statuses: write

jobs:
  promote:
    runs-on: [self-hosted, home-mac]
    timeout-minutes: 60
    concurrency:
      group: deploy-${{ github.repository }}-prod
      cancel-in-progress: false
    env:
      NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HC_PING: ${{ secrets.HC_PING_PROD }}
      WANTED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ github.event.repository.name }}
          ref: dev
          clean: true
          fetch-depth: 0
      - name: Resolve the commit and fetch sil_common
        run: |
          git -C "$NAME" fetch origin dev master || git -C "$NAME" fetch origin dev
          sha="$WANTED_SHA"
          [ -n "$sha" ] || sha="$(git -C "$NAME" rev-parse origin/dev)"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          git -C "$NAME" checkout --detach "$sha"
          common="$(jq -r .common "$NAME/sil.json")"
          rm -rf sil_common
          git clone --depth 1 --branch "$common" git@github.com:studioinfinitelives/sil_common.git sil_common
      - name: Gate
        run: bash sil_common/tool/ci/gate.sh "$NAME" "$SHA"
      - name: Release notes check
        run: |
          notes="$(python3 sil_common/tool/ci/config.py "$NAME" releaseNotes assets/release_notes.json)"
          if [ -f "$NAME/$notes" ]; then
            cd "$NAME" && RELEASE_NOTES_FILE="$notes" python3 ../sil_common/tool/release_notes.py check --current
          fi
      - name: Copy ciFiles
        run: |
          bash sil_common/tool/ci/setup.sh "$NAME"
          bash sil_common/tool/ci/files.sh "$NAME" copy
      - name: Apply Terraform to prod
        run: |
          [ -f "$NAME/infra/terraform/envs/prod.tfvars" ] || exit 0
          last="$(git -C "$NAME" describe --tags --abbrev=0 --match 'v*' "$SHA" 2>/dev/null || true)"
          if [ -n "$last" ] && git -C "$NAME" diff --quiet "$last" "$SHA" -- infra; then
            echo "infra/ unchanged since $last: no Terraform apply"
            exit 0
          fi
          bash sil_common/tool/ci/terraform.sh "$NAME" prod apply && exit 0
          code=$?
          if [ $code -eq 3 ]; then
            echo "Plan deletes resources. Run the Terraform workflow with allow_delete, then /prod again." >&2
          fi
          exit $code
      - name: Deploy to prod
        run: bash sil_common/tool/ci/deploy.sh "$NAME" prod
      - name: Smoke test
        run: bash sil_common/tool/ci/smoke.sh "$NAME" prod
      - name: Move master, tag and release
        run: bash sil_common/tool/ci/release.sh "$NAME" "$SHA"
      - name: Record the deploy
        run: bash sil_common/tool/ci/record.sh "$NAME" prod success
      - name: Ping success
        if: success()
        run: '[ -z "$HC_PING" ] || curl -fsS -m 15 --retry 3 "$HC_PING" >/dev/null || true'
      - name: Ping failure
        # Inline, not ping.sh: a rollback runs an older sil_common that may not have it.
        # Not being signed in today is not an alert (deploy.sh and terraform.sh leave the marker).
        if: failure()
        run: |
          [ -n "$HC_PING" ] || exit 0
          [ -f "$RUNNER_TEMP/sil-not-signed-in" ] && exit 0
          curl -fsS -m 15 --retry 3 "$HC_PING/fail" >/dev/null || true
      - name: Remove ciFiles
        if: always()
        run: bash sil_common/tool/ci/files.sh "$NAME" clean
